name: Propose Mobilerun iOS formula update

on:
  repository_dispatch:
    types: [mobilerun-ios-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobilerun-ios-formula-update
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN }}
        run: test -n "$AUTOMATION_TOKEN"
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/droidrun/mobilerun-ios-releases/releases/tags/$TAG" \
            --jq 'select(.draft == false and .prerelease == false and .published_at != null) | .tag_name' \
            | grep -Fx -- "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Generate and validate the formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/bump-mobilerun-ios.sh "$TAG"
          ruby -c Formula/mobilerun-ios.rb
      - name: Open the formula review PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.AUTOMATION_PR_TOKEN }}
          base: main
          branch: automation/mobilerun-ios-${{ steps.release.outputs.tag }}
          delete-branch: true
          add-paths: Formula/mobilerun-ios.rb
          title: 'chore: update mobilerun-ios to ${{ steps.release.outputs.tag }}'
          commit-message: 'chore: update mobilerun-ios to ${{ steps.release.outputs.tag }}'
          body: |
            Update the formula from the published release and its SHA256SUMS:
            https://github.com/droidrun/mobilerun-ios-releases/releases/tag/${{ steps.release.outputs.tag }}

            Review the version, download URLs and checksums before merging.
